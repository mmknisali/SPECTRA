name: Deploy to Vast.ai

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt
          pip install pytest pytest-asyncio httpx
      
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short || echo "No tests yet"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VAST_SSH_KEY }}
      
      - name: Add Vast.ai to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VAST_SSH_PORT }} ${{ secrets.VAST_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to Vast.ai
        env:
          VAST_HOST: ${{ secrets.VAST_HOST }}
          VAST_PORT: ${{ secrets.VAST_SSH_PORT }}
          VAST_USER: ${{ secrets.VAST_USER }}
        run: |
          # Create deployment script
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "🚀 Starting deployment..."
          
          # Pull latest images
          echo "📦 Pulling latest images..."
          docker pull ghcr.io/${{ github.repository }}:latest
          
          # Backup database before migration
          echo "💾 Creating database backup..."
          docker exec spectra_db mysqldump -u root -p${DB_ROOT_PASSWORD} spectra_db > backup_$(date +%Y%m%d_%H%M%S).sql || true
          
          # Stop existing containers
          echo "🛑 Stopping existing containers..."
          docker-compose -f docker-compose.prod.yml down
          
          # Start services
          echo "▶️ Starting services..."
          docker-compose -f docker-compose.prod.yml up -d
          
          # Run database migrations
          echo "🔄 Running database migrations..."
          docker exec spectra_app alembic upgrade head
          
          # Health check
          echo "🏥 Performing health check..."
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          
          # Cleanup old images
          echo "🧹 Cleaning up..."
          docker image prune -f
          
          echo "✅ Deployment complete!"
          EOF
          
          chmod +x deploy.sh
          
          # Copy deployment files to server
          scp -P $VAST_PORT docker-compose.prod.yml deploy.sh .env.production $VAST_USER@$VAST_HOST:/root/spectra/
          
          # Execute deployment
          ssh -p $VAST_PORT $VAST_USER@$VAST_HOST "cd /root/spectra && bash deploy.sh"
      
      - name: Verify deployment
        run: |
          sleep 15
          curl -f http://${{ secrets.VAST_HOST }}:8000/health || exit 1
          echo "✅ Deployment verified!"

  backup:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: deploy
    
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VAST_SSH_KEY }}
      
      - name: Database backup
        run: |
          ssh -p ${{ secrets.VAST_SSH_PORT }} ${{ secrets.VAST_USER }}@${{ secrets.VAST_HOST }} \
            "docker exec spectra_db mysqldump -u root -p${{ secrets.DB_ROOT_PASSWORD }} spectra_db | gzip > /backups/spectra_$(date +%Y%m%d_%H%M%S).sql.gz"
