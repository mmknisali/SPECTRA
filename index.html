<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRA - Klinik Karar Destek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f1923;
            --surface: #182734;
            --surface-hover: #1e3347;
            --border: rgba(255,255,255,0.08);
            --accent: #0891b2;
            --accent-light: #22d3ee;
            --accent-subtle: rgba(8,145,178,0.15);
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius: 8px;
            --radius-sm: 6px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: rgba(0,0,0,0.6);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }

        .modal {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: min(90vw, 900px);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .modal-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-header .logo-icon {
            width: 30px;
            height: 30px;
            background: var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .modal-header .logo-text {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .modal-header .logo-text span {
            color: var(--accent-light);
        }

        .modal-header .subtitle {
            font-size: 11px;
            color: var(--text-muted);
        }

        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .input-group label i {
            margin-right: 5px;
            color: var(--accent);
            font-size: 10px;
            width: 14px;
        }

        .input-group textarea {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            padding: 10px 12px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
            line-height: 1.5;
        }

        .input-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-subtle);
        }

        .input-group textarea::placeholder {
            color: var(--text-muted);
        }

        .input-group textarea#clinicalText {
            min-height: 100px;
            max-height: 180px;
        }

        .input-group textarea#labText {
            min-height: 100px;
            max-height: 180px;
        }

        .action-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            height: 36px;
            padding: 0 22px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }

        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 1px 3px rgba(8,145,178,0.3);
        }

        .btn-primary:hover:not(:disabled) {
            background: #0e7490;
            box-shadow: 0 2px 8px rgba(8,145,178,0.4);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--surface-hover);
            border-color: rgba(255,255,255,0.15);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.ready { background: var(--success); }
        .status-dot.error { background: var(--danger); }
        .status-dot.unknown { background: var(--text-muted); }

        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0;
            flex-shrink: 0;
        }

        .tab {
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: inherit;
        }

        .tab:hover { color: var(--text-secondary); }
        .tab.active { color: var(--accent-light); border-bottom-color: var(--accent); }
        .tab .tab-count {
            background: var(--surface);
            padding: 0 7px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .tab.active .tab-count {
            background: var(--accent-subtle);
            color: var(--accent-light);
        }

        .tab-content { display: none; flex-direction: column; gap: 12px; }
        .tab-content.active { display: flex; }

        .result-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            transition: border-color 0.2s;
        }

        .result-card:hover {
            border-color: rgba(255,255,255,0.12);
        }

        .result-card .card-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-card .card-value {
            font-size: 13px;
            color: var(--text);
            line-height: 1.5;
        }

        .result-card .card-value .highlight {
            color: var(--accent-light);
            font-weight: 600;
        }

        .risk-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        .risk-badge.dusuk { background: rgba(34,197,94,0.15); color: var(--success); }
        .risk-badge.orta { background: rgba(245,158,11,0.15); color: var(--warning); }
        .risk-badge.yuksek { background: rgba(239,68,68,0.15); color: var(--danger); }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            background: var(--bg);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .tag.danger { border-color: rgba(239,68,68,0.3); color: var(--danger); }
        .tag.warning { border-color: rgba(245,158,11,0.3); color: var(--warning); }
        .tag.success { border-color: rgba(34,197,94,0.3); color: var(--success); }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 30px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .loading .spinner,
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 28px;
            opacity: 0.3;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 13px;
        }

        .source-badge {
            font-size: 10px;
            color: var(--text-muted);
            padding: 2px 8px;
            background: var(--bg);
            border-radius: 4px;
            display: inline-block;
        }

        .error-box {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 12px;
            color: var(--danger);
        }

        .flex-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .health-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            background: var(--surface);
            border-radius: var(--radius-sm);
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        @media (max-width: 700px) {
            .input-row { grid-template-columns: 1fr; }
            .modal { width: 100vw; max-height: 100vh; border-radius: 0; }
            .modal-body { padding: 16px; }
            .tabs { overflow-x: auto; }
        }
    </style>
</head>
<body>

<div class="modal" id="spectraModal">
    <div class="modal-header">
        <div class="logo">
            <div class="logo-icon">S</div>
            <div>
                <div class="logo-text">Spectra<span>HBYS</span></div>
                <div class="subtitle">Klinik Karar Destek Sistemi</div>
            </div>
        </div>
        <div class="flex-row">
            <div class="health-bar" id="healthBar">
                <span class="status-dot unknown" id="healthDot"></span>
                <span id="healthText">Bağlantı kontrol ediliyor...</span>
            </div>
        </div>
    </div>

    <div class="modal-body">
        <div class="input-section">
            <div class="input-row">
                <div class="input-group">
                    <label for="clinicalText"><i class="fas fa-notes-medical"></i> Klinik Not / Epikriz</label>
                    <textarea id="clinicalText" placeholder="Hastanın epikriz, hikaye veya klinik notlarını yapıştırın..."></textarea>
                </div>
                <div class="input-group">
                    <label for="labText"><i class="fas fa-flask"></i> Laboratuvar Sonuçları</label>
                    <textarea id="labText" placeholder="Opsiyonel: Lab sonuçlarını yapıştırın..."></textarea>
                </div>
            </div>
            <div class="action-bar">
                <button class="btn btn-primary" id="analyzeBtn"><i class="fas fa-brain"></i> Analiz Et</button>
                <button class="btn btn-secondary" id="clearBtn"><i class="fas fa-times"></i> Temizle</button>
                <span style="font-size:11px;color:var(--text-muted);margin-left:auto;" id="charCount">0 karakter</span>
            </div>
        </div>

        <div class="tabs" id="tabHeaders">
            <button class="tab active" data-tab="risk">
                <i class="fas fa-exclamation-triangle"></i> Risk Raporu
                <span class="tab-count" id="riskCount">0</span>
            </button>
            <button class="tab" data-tab="summary">
                <i class="fas fa-user-md"></i> Hasta Özeti
                <span class="tab-count" id="summaryCount">0</span>
            </button>
            <button class="tab" data-tab="icd10">
                <i class="fas fa-code"></i> ICD-10 Kodları
                <span class="tab-count" id="icd10Count">0</span>
            </button>
        </div>

        <div id="tabRisk" class="tab-content active"></div>
        <div id="tabSummary" class="tab-content"></div>
        <div id="tabIcd10" class="tab-content"></div>
    </div>
</div>

<script>
const API_BASE = window.location.origin;
const clinicalInput = document.getElementById('clinicalText');
const labInput = document.getElementById('labText');
const analyzeBtn = document.getElementById('analyzeBtn');
const clearBtn = document.getElementById('clearBtn');
const charCount = document.getElementById('charCount');

const tabRisk = document.getElementById('tabRisk');
const tabSummary = document.getElementById('tabSummary');
const tabIcd10 = document.getElementById('tabIcd10');
const riskCount = document.getElementById('riskCount');
const summaryCount = document.getElementById('summaryCount');
const icd10Count = document.getElementById('icd10Count');

clinicalInput.addEventListener('input', () => {
    const len = clinicalInput.value.length;
    charCount.textContent = `${len} karakter`;
});

function showLoading(container, message = 'Analiz ediliyor...') {
    container.innerHTML = `<div class="loading"><div class="spinner"></div>${message}</div>`;
    container.classList.add('active');
}

function showError(container, msg) {
    container.innerHTML = `<div class="error-box"><i class="fas fa-exclamation-circle"></i> ${msg}</div>`;
    container.classList.add('active');
}

function showEmpty(container, msg = 'Analiz yapılmadı. Klinik not girin ve "Analiz Et" butonuna tıklayın.') {
    container.innerHTML = `<div class="empty-state"><i class="fas fa-file-medical"></i><p>${msg}</p></div>`;
    container.classList.add('active');
}

async function checkHealth() {
    const dot = document.getElementById('healthDot');
    const text = document.getElementById('healthText');
    try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        if (data.status === 'healthy') {
            dot.className = 'status-dot ready';
            text.textContent = `Bağlı | KB:${data.knowledge_base_size} | Chroma:${data.chroma_documents} | Ollama:${data.ollama_available ? '✓' : '✗'}`;
        } else {
            dot.className = 'status-dot error';
            text.textContent = 'Bağlantı hatası';
        }
    } catch {
        dot.className = 'status-dot error';
        text.textContent = 'API bağlanamadı';
    }
}

function renderRiskReport(data) {
    const level = (data.risk_level || 'düşük').toLowerCase();
    const levelLabels = { düşük: 'Düşük', orta: 'Orta', yüksek: 'Yüksek' };
    const html = `
        <div class="result-card" style="border-color: ${level === 'yüksek' ? 'rgba(239,68,68,0.4)' : level === 'orta' ? 'rgba(245,158,11,0.4)' : 'rgba(34,197,94,0.4)'}">
            <div class="card-label"><i class="fas fa-chart-line"></i> Risk Seviyesi</div>
            <div class="card-value">
                <span class="risk-badge ${level}">${levelLabels[level] || level}</span>
            </div>
        </div>
        ${data.risk_factors && data.risk_factors.length ? `
        <div class="result-card">
            <div class="card-label"><i class="fas fa-list"></i> Risk Faktörleri</div>
            <div class="card-value">
                <div class="tag-list">${data.risk_factors.map(f => `<span class="tag ${level === 'yüksek' ? 'danger' : level === 'orta' ? 'warning' : 'success'}">${f}</span>`).join('')}</div>
            </div>
        </div>` : ''}
        ${data.abnormal_labs && data.abnormal_labs.length ? `
        <div class="result-card">
            <div class="card-label"><i class="fas fa-flask"></i> Anormal Lab Değerleri</div>
            <div class="card-value">
                <div class="tag-list">${data.abnormal_labs.map(l => `<span class="tag danger">${l}</span>`).join('')}</div>
            </div>
        </div>` : ''}
        ${data.metastasis_indicators && data.metastasis_indicators.length ? `
        <div class="result-card">
            <div class="card-label"><i class="fas fa-arrow-right"></i> Metastaz Bulguları</div>
            <div class="card-value">
                <div class="tag-list">${data.metastasis_indicators.map(m => `<span class="tag warning">${m}</span>`).join('')}</div>
            </div>
        </div>` : ''}
        ${data.recommendations && data.recommendations.length ? `
        <div class="result-card">
            <div class="card-label"><i class="fas fa-lightbulb"></i> Öneriler</div>
            <div class="card-value">
                <ul style="margin:0;padding-left:18px;font-size:12px;line-height:1.8;color:var(--text-secondary);">
                    ${data.recommendations.map(r => `<li>${r}</li>`).join('')}
                </ul>
            </div>
        </div>` : ''}
        <div style="text-align:right;"><span class="source-badge"><i class="fas fa-database"></i> ${data.source || 'fallback'}</span></div>`;
    tabRisk.innerHTML = html;
    tabRisk.classList.add('active');
    riskCount.textContent = data.risk_factors ? data.risk_factors.length : '0';
}

function renderSummary(data) {
    const html = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="result-card">
                <div class="card-label"><i class="fas fa-disease"></i> Kanser Türü</div>
                <div class="card-value"><span class="highlight">${data.cancer_type || 'Belirlenemedi'}</span></div>
            </div>
            <div class="result-card">
                <div class="card-label"><i class="fas fa-sort-amount-up"></i> Evre</div>
                <div class="card-value">${data.stage || 'Belirtilmemiş'}</div>
            </div>
        </div>
        ${data.treatment_history && data.treatment_history.length ? `
        <div class="result-card">
            <div class="card-label"><i class="fas fa-history"></i> Tedavi Geçmişi</div>
            <div class="card-value">
                <div class="tag-list">${data.treatment_history.map(t => `<span class="tag">${t}</span>`).join('')}</div>
            </div>
        </div>` : ''}
        ${data.current_medications && data.current_medications.length ? `
        <div class="result-card">
            <div class="card-label"><i class="fas fa-prescription"></i> Mevcut İlaçlar</div>
            <div class="card-value">
                <div class="tag-list">${data.current_medications.map(m => `<span class="tag success">${m}</span>`).join('')}</div>
            </div>
        </div>` : ''}
        ${data.key_findings && data.key_findings.length ? `
        <div class="result-card">
            <div class="card-label"><i class="fas fa-stethoscope"></i> Klinik Bulgular</div>
            <div class="card-value">
                <ul style="margin:0;padding-left:18px;font-size:12px;line-height:1.8;color:var(--text-secondary);">
                    ${data.key_findings.map(f => `<li>${f}</li>`).join('')}
                </ul>
            </div>
        </div>` : ''}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="result-card">
                <div class="card-label"><i class="fas fa-heartbeat"></i> Performans Durumu</div>
                <div class="card-value">${data.performance_status || 'Belirtilmemiş'}</div>
            </div>
        </div>
        <div style="text-align:right;"><span class="source-badge"><i class="fas fa-database"></i> ${data.source || 'fallback'}</span></div>`;
    tabSummary.innerHTML = html;
    tabSummary.classList.add('active');
    summaryCount.textContent = data.treatment_history ? data.treatment_history.length : '0';
}

function renderIcd10(data) {
    const codes = data.suggested_codes || [];
    if (!codes.length) {
        tabIcd10.innerHTML = `<div class="empty-state"><i class="fas fa-code"></i><p>ICD-10 kodu bulunamadı.</p></div>`;
        tabIcd10.classList.add('active');
        icd10Count.textContent = '0';
        return;
    }
    const rows = codes.map(c => `
        <tr>
            <td><strong>${c.code}</strong></td>
            <td style="color:var(--text-secondary);font-size:12px;">${c.description || '-'}</td>
            <td>
                <div style="display:flex;gap:4px;flex-wrap:wrap;">
                    ${(c.cancer_types || []).map(ct => `<span style="font-size:10px;background:var(--bg);padding:1px 6px;border-radius:3px;color:var(--text-muted);">${ct}</span>`).join('')}
                </div>
            </td>
            <td style="text-align:right;">
                <span style="font-size:12px;font-weight:600;color:${c.score > 0.7 ? 'var(--success)' : c.score > 0.3 ? 'var(--warning)' : 'var(--text-muted)'}">${(c.score * 100).toFixed(0)}%</span>
            </td>
        </tr>
    `).join('');
    const html = `
        <div class="result-card" style="padding:0;">
            <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;font-size:12px;">
                    <thead>
                        <tr style="border-bottom:1px solid var(--border);">
                            <th style="text-align:left;padding:10px 14px;color:var(--text-muted);font-weight:600;font-size:10px;text-transform:uppercase;">Kod</th>
                            <th style="text-align:left;padding:10px 14px;color:var(--text-muted);font-weight:600;font-size:10px;text-transform:uppercase;">Tanım</th>
                            <th style="text-align:left;padding:10px 14px;color:var(--text-muted);font-weight:600;font-size:10px;text-transform:uppercase;">Kanser Türü</th>
                            <th style="text-align:right;padding:10px 14px;color:var(--text-muted);font-weight:600;font-size:10px;text-transform:uppercase;">Skor</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        </div>
        <div style="text-align:right;"><span class="source-badge"><i class="fas fa-database"></i> ${data.source || 'knowledge_base'}</span></div>`;
    tabIcd10.innerHTML = html;
    tabIcd10.classList.add('active');
    icd10Count.textContent = codes.length;
}

async function runAnalysis() {
    const clinicalText = clinicalInput.value.trim();
    if (!clinicalText || clinicalText.length < 10) {
        showError(tabRisk, 'Lütfen en az 10 karakterlik klinik not girin.');
        showEmpty(tabSummary, 'Klinik not girilmedi.');
        showEmpty(tabIcd10, 'Klinik not girilmedi.');
        return;
    }

    showLoading(tabRisk, 'Risk analizi yapılıyor...');
    showLoading(tabSummary, 'Hasta özeti çıkarılıyor...');
    showLoading(tabIcd10, 'ICD-10 kodları taranıyor...');
    riskCount.textContent = '...';
    summaryCount.textContent = '...';
    icd10Count.textContent = '...';

    analyzeBtn.disabled = true;
    analyzeBtn.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px;"></div> Analiz Ediliyor...';

    const labText = labInput.value.trim();
    const headers = { 'Content-Type': 'application/json' };

    const promises = [
        fetch(`${API_BASE}/analyze/risk`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ clinical_text: clinicalText, lab_text: labText || null })
        }).then(r => r.ok ? r.json() : Promise.reject(`Risk: ${r.status}`))
         .then(renderRiskReport)
         .catch(err => showError(tabRisk, `Risk analizi başarısız: ${err}`)),

        fetch(`${API_BASE}/analyze/summary`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ clinical_text: clinicalText, lab_text: labText || null })
        }).then(r => r.ok ? r.json() : Promise.reject(`Özet: ${r.status}`))
         .then(renderSummary)
         .catch(err => showError(tabSummary, `Özet çıkarma başarısız: ${err}`)),

        fetch(`${API_BASE}/predict/icd10`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ clinical_note: clinicalText, cancer_type: null })
        }).then(r => r.ok ? r.json() : Promise.reject(`ICD-10: ${r.status}`))
         .then(renderIcd10)
         .catch(err => showError(tabIcd10, `ICD-10 sorgusu başarısız: ${err}`))
    ];

    await Promise.allSettled(promises);

    analyzeBtn.disabled = false;
    analyzeBtn.innerHTML = '<i class="fas fa-brain"></i> Analiz Et';
}

document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        const target = document.getElementById('tab' + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1));
        if (target) target.classList.add('active');
    });
});

analyzeBtn.addEventListener('click', runAnalysis);

clearBtn.addEventListener('click', () => {
    clinicalInput.value = '';
    labInput.value = '';
    charCount.textContent = '0 karakter';
    showEmpty(tabRisk, 'Analiz yapılmadı.');
    showEmpty(tabSummary, 'Analiz yapılmadı.');
    showEmpty(tabIcd10, 'Analiz yapılmadı.');
    riskCount.textContent = '0';
    summaryCount.textContent = '0';
    icd10Count.textContent = '0';
});

clinicalInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        runAnalysis();
    }
});

showEmpty(tabRisk);
showEmpty(tabSummary);
showEmpty(tabIcd10);
checkHealth();
</script>

</body>
</html>
